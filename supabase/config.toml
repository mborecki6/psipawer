project_id = "psi-pawer"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "2MiB"
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/recovery", "http://127.0.0.1:3000/auth/recovery"]
jwt_expiry = 3600
enable_signup = false
[auth.email]
# Keep the email/password provider enabled for existing and invited accounts.
# Public registration is blocked by auth.enable_signup=false above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
[auth.email.template.recovery]
subject = "Ustaw nowe hasło — Psi Pawer"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.invite]
subject = "Zaproszenie do wspólnej pracy — Psi Pawer"
content_path = "./supabase/templates/invite.html"
