<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#211d1a" />
  <meta name="description" content="Psi Pawer — panel spacerów socjalizacyjnych, profili psów, pakietów i społeczności Psiutki." />
  <title>Psi Pawer — MVP</title>
  <style>
:root {
  --ink: #211d1a;
  --ink-soft: #5b5550;
  --paper: #f6f1eb;
  --paper-2: #fffaf4;
  --surface: #fffaf4;
  --forest: #211d1a;
  --forest-2: #332d29;
  --sage: #dfe8e5;
  --sage-2: #edf2ef;
  --clay: #be8174;
  --clay-2: #e1d3cb;
  --sand: #ead9bf;
  --amber: #b67b37;
  --amber-soft: #f2e2c7;
  --red: #9a5147;
  --red-soft: #ecd5cf;
  --blue: #55727a;
  --blue-soft: #dfe8e5;
  --line: #ded8d0;
  --line-strong: #c8c0b7;
  --shadow: 0 14px 40px rgba(33, 29, 26, 0.09);
  --shadow-soft: 0 8px 24px rgba(33, 29, 26, 0.07);
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --sidebar: 264px;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--paper);
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at top right, rgba(217, 153, 139, 0.18), transparent 30%),
    radial-gradient(circle at 0 85%, rgba(220, 232, 221, 0.65), transparent 34%),
    var(--paper);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  color: inherit;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(61, 106, 122, 0.28);
  outline-offset: 2px;
}

.hidden {
  display: none !important;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 40;
  width: var(--sidebar);
  display: flex;
  flex-direction: column;
  padding: 24px 18px 18px;
  color: #fff;
  background:
    radial-gradient(circle at 18% 10%, rgba(255, 255, 255, 0.09), transparent 24%),
    linear-gradient(180deg, #294f43 0%, #1f3d34 100%);
  box-shadow: 10px 0 34px rgba(25, 46, 39, 0.1);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 24px;
}

.brand-mark {
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  color: var(--forest);
  background: var(--paper-2);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
}

.brand-mark svg {
  width: 28px;
  height: 28px;
}

.brand-copy strong {
  display: block;
  font-size: 17px;
  letter-spacing: -0.02em;
}

.brand-copy span {
  display: block;
  margin-top: 2px;
  color: rgba(255, 255, 255, 0.68);
  font-size: 11px;
  line-height: 1.25;
}

.role-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 4px 20px;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.07);
}

.role-avatar {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: var(--forest);
  background: var(--sand);
  font-weight: 800;
}

.role-copy {
  min-width: 0;
  flex: 1;
}

.role-copy strong,
.role-copy span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.role-copy strong {
  font-size: 13px;
}

.role-copy span {
  margin-top: 2px;
  color: rgba(255, 255, 255, 0.64);
  font-size: 11px;
}

.sidebar-nav {
  display: grid;
  gap: 4px;
}

.nav-label {
  margin: 12px 12px 7px;
  color: rgba(255, 255, 255, 0.48);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  border: 0;
  border-radius: 12px;
  color: rgba(255, 255, 255, 0.76);
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: 160ms ease;
}

.nav-item:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.07);
}

.nav-item.active {
  color: #fff;
  background: rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}

.nav-item svg {
  width: 19px;
  height: 19px;
  flex: 0 0 19px;
}

.nav-item span {
  flex: 1;
  font-size: 13px;
  font-weight: 700;
}

.nav-count {
  min-width: 22px;
  height: 22px;
  display: inline-grid;
  place-items: center;
  padding: 0 7px;
  border-radius: 99px;
  color: var(--forest);
  background: var(--clay-2);
  font-size: 10px;
  font-weight: 900;
}

.sidebar-footer {
  margin-top: auto;
  display: grid;
  gap: 10px;
}

.role-switcher {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}

.role-switcher option {
  color: var(--ink);
}

.sidebar-foot-row {
  display: flex;
  gap: 8px;
}

.sidebar-mini-button {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 11px;
  color: rgba(255, 255, 255, 0.72);
  background: transparent;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
}

.sidebar-mini-button:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.07);
}

.sidebar-mini-button svg {
  width: 15px;
  height: 15px;
}

.main {
  grid-column: 2;
  min-width: 0;
  padding: 0 34px 46px;
}

.topbar {
  min-height: 92px;
  display: flex;
  align-items: center;
  gap: 18px;
  position: sticky;
  top: 0;
  z-index: 25;
  padding: 16px 0;
  background: linear-gradient(180deg, rgba(246, 241, 232, 0.96) 72%, rgba(246, 241, 232, 0));
  backdrop-filter: blur(8px);
}

.mobile-menu-button {
  display: none;
}

.page-heading {
  min-width: 0;
  flex: 1;
}

.page-heading h1 {
  margin: 0;
  font-size: clamp(26px, 3vw, 38px);
  line-height: 1.08;
  letter-spacing: -0.045em;
}

.page-heading p {
  margin: 6px 0 0;
  color: var(--ink-soft);
  font-size: 13px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-button {
  position: relative;
  width: 43px;
  height: 43px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.75);
  cursor: pointer;
  box-shadow: 0 5px 18px rgba(31, 61, 52, 0.04);
}

.icon-button:hover {
  border-color: var(--line-strong);
  background: #fff;
}

.icon-button svg {
  width: 19px;
  height: 19px;
}

.notification-dot {
  position: absolute;
  top: 7px;
  right: 8px;
  width: 8px;
  height: 8px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--clay);
}

.primary-button,
.secondary-button,
.ghost-button,
.danger-button,
.small-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 800;
  transition: 150ms ease;
}

.primary-button {
  min-height: 43px;
  padding: 10px 16px;
  border: 1px solid var(--forest);
  color: #fff;
  background: var(--forest);
  box-shadow: 0 9px 22px rgba(36, 72, 61, 0.18);
}

.primary-button:hover {
  transform: translateY(-1px);
  background: var(--forest-2);
}

.primary-button svg,
.secondary-button svg,
.ghost-button svg,
.danger-button svg,
.small-button svg {
  width: 17px;
  height: 17px;
}

.secondary-button {
  min-height: 42px;
  padding: 9px 14px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: #fff;
}

.secondary-button:hover {
  border-color: var(--line-strong);
  background: var(--paper-2);
}

.ghost-button {
  min-height: 38px;
  padding: 8px 11px;
  border: 0;
  color: var(--forest);
  background: transparent;
}

.ghost-button:hover {
  background: var(--sage-2);
}

.danger-button {
  min-height: 42px;
  padding: 9px 14px;
  border: 1px solid var(--red-soft);
  color: var(--red);
  background: var(--red-soft);
}

.small-button {
  min-height: 34px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  color: var(--ink);
  background: #fff;
  font-size: 11px;
}

.small-button:hover {
  border-color: var(--line-strong);
}

.small-button.primary {
  border-color: var(--forest);
  color: #fff;
  background: var(--forest);
}

.small-button.soft {
  border-color: var(--sage);
  color: var(--forest);
  background: var(--sage-2);
}

.small-button.warn {
  border-color: var(--amber-soft);
  color: #855818;
  background: var(--amber-soft);
}

.small-button.danger {
  border-color: var(--red-soft);
  color: var(--red);
  background: var(--red-soft);
}

.page-content {
  max-width: 1500px;
  margin: 0 auto;
}

.stack {
  display: grid;
  gap: 20px;
}

.stack-sm {
  display: grid;
  gap: 12px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.72fr);
  gap: 22px;
}

.card {
  border: 1px solid rgba(201, 194, 183, 0.72);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.86);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}

.card.pad {
  padding: 22px;
}

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 0;
}

.card-head h2,
.card-head h3,
.section-title h2,
.section-title h3 {
  margin: 0;
  letter-spacing: -0.03em;
}

.card-head h2,
.section-title h2 {
  font-size: 20px;
}

.card-head h3,
.section-title h3 {
  font-size: 16px;
}

.card-head p,
.section-title p {
  margin: 5px 0 0;
  color: var(--ink-soft);
  font-size: 12px;
  line-height: 1.5;
}

.card-body {
  padding: 18px 22px 22px;
}

.section-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 14px;
}

.kpi-card {
  min-height: 126px;
  position: relative;
  padding: 18px;
  border: 1px solid rgba(201, 194, 183, 0.72);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.84);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}

.kpi-card::after {
  content: "";
  position: absolute;
  width: 90px;
  height: 90px;
  right: -28px;
  bottom: -30px;
  border-radius: 50%;
  background: var(--kpi-accent, var(--sage));
  opacity: 0.72;
}

.kpi-top {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.kpi-label {
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 700;
}

.kpi-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: var(--forest);
  background: var(--kpi-accent, var(--sage));
}

.kpi-icon svg {
  width: 17px;
  height: 17px;
}

.kpi-value {
  position: relative;
  z-index: 1;
  margin-top: 10px;
  font-size: 30px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -0.05em;
}

.kpi-note {
  position: relative;
  z-index: 1;
  margin-top: 7px;
  color: var(--ink-soft);
  font-size: 11px;
}

.kpi-card--clickable {
  width: 100%;
  appearance: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
}

.kpi-card--clickable:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 16px 34px rgba(33, 29, 26, 0.12);
}

.kpi-card--clickable:active {
  transform: translateY(0);
}

.kpi-card--clickable .kpi-note {
  padding-right: 58px;
}

.kpi-link {
  position: absolute;
  right: 16px;
  bottom: 14px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--ink);
  font-size: 10px;
  font-weight: 850;
}

.kpi-link svg {
  width: 13px;
  height: 13px;
  transition: transform 160ms ease;
}

.kpi-card--clickable:hover .kpi-link svg {
  transform: translateX(2px);
}

.jump-target {
  scroll-margin-top: 112px;
}

.jump-highlight {
  border-color: rgba(190, 129, 116, 0.72);
  box-shadow: 0 14px 38px rgba(190, 129, 116, 0.16);
}

.hero-card {
  position: relative;
  min-height: 220px;
  padding: 26px;
  color: #fff;
  background:
    radial-gradient(circle at 88% 20%, rgba(255, 255, 255, 0.13), transparent 20%),
    linear-gradient(135deg, #2d594b 0%, #1f3d34 100%);
}

.hero-card::before,
.hero-card::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.hero-card::before {
  width: 260px;
  height: 260px;
  right: -92px;
  top: -90px;
}

.hero-card::after {
  width: 170px;
  height: 170px;
  right: -15px;
  bottom: -118px;
}

.hero-content {
  position: relative;
  z-index: 1;
  max-width: 580px;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 14px;
  padding: 7px 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 99px;
  color: rgba(255, 255, 255, 0.78);
  background: rgba(255, 255, 255, 0.08);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.hero-card h2 {
  max-width: 540px;
  margin: 0;
  font-size: clamp(28px, 4vw, 46px);
  line-height: 1.02;
  letter-spacing: -0.055em;
}

.hero-card p {
  max-width: 530px;
  margin: 13px 0 0;
  color: rgba(255, 255, 255, 0.74);
  font-size: 14px;
  line-height: 1.55;
}

.hero-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.hero-card .primary-button {
  border-color: var(--paper-2);
  color: var(--forest);
  background: var(--paper-2);
}

.hero-card .secondary-button {
  border-color: rgba(255, 255, 255, 0.18);
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}

.list {
  display: grid;
}

.list-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.list-row:first-child {
  padding-top: 0;
}

.list-row:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}

.list-main {
  min-width: 0;
  flex: 1;
}

.list-main strong {
  display: block;
  font-size: 13px;
}

.list-main span {
  display: block;
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.4;
}

.date-tile {
  width: 48px;
  height: 52px;
  flex: 0 0 48px;
  display: grid;
  place-content: center;
  text-align: center;
  border-radius: 13px;
  color: var(--forest);
  background: var(--sage-2);
}

.date-tile b {
  font-size: 18px;
  line-height: 1;
}

.date-tile span {
  margin-top: 3px;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 25px;
  padding: 5px 9px;
  border-radius: 99px;
  color: var(--ink-soft);
  background: #f0eee9;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.75;
}

.badge.green {
  color: #2d6753;
  background: var(--sage-2);
}

.badge.amber {
  color: #8d601e;
  background: var(--amber-soft);
}

.badge.red {
  color: var(--red);
  background: var(--red-soft);
}

.badge.blue {
  color: var(--blue);
  background: var(--blue-soft);
}

.badge.clay {
  color: #8b5347;
  background: var(--clay-2);
}

.badge.dark {
  color: #fff;
  background: var(--forest);
}

.badge.no-dot::before {
  display: none;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.tag {
  display: inline-flex;
  align-items: center;
  min-height: 25px;
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 99px;
  color: var(--ink-soft);
  background: var(--paper-2);
  font-size: 10px;
  font-weight: 700;
}

.alert {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 13px 14px;
  border-radius: 13px;
  font-size: 12px;
  line-height: 1.45;
}

.alert svg {
  width: 18px;
  height: 18px;
  flex: 0 0 18px;
  margin-top: 1px;
}

.alert.amber {
  color: #6f4c1a;
  background: var(--amber-soft);
}

.alert.red {
  color: #7c3938;
  background: var(--red-soft);
}

.alert.green {
  color: #2b5d4d;
  background: var(--sage-2);
}

.alert.blue {
  color: #315966;
  background: var(--blue-soft);
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
}

.toolbar-left,
.toolbar-right {
  display: flex;
  align-items: center;
  gap: 9px;
}

.search-box {
  position: relative;
  min-width: 250px;
}

.search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  width: 16px;
  height: 16px;
  color: var(--ink-soft);
  transform: translateY(-50%);
  pointer-events: none;
}

.search-box input {
  width: 100%;
  min-height: 42px;
  padding: 9px 12px 9px 37px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.82);
}

.filter-select {
  min-height: 42px;
  padding: 9px 34px 9px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.82);
}

.walk-list {
  display: grid;
  gap: 12px;
}

.walk-row {
  display: grid;
  grid-template-columns: 72px minmax(210px, 1.25fr) minmax(180px, 1fr) minmax(150px, 0.75fr) auto;
  align-items: center;
  gap: 16px;
  padding: 16px 18px;
  border: 1px solid rgba(201, 194, 183, 0.75);
  border-radius: 17px;
  background: rgba(255, 255, 255, 0.84);
  box-shadow: 0 7px 20px rgba(40, 51, 46, 0.045);
  cursor: pointer;
  transition: 150ms ease;
}

.walk-row:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow-soft);
}

.walk-date {
  text-align: center;
  padding: 8px 6px;
  border-right: 1px solid var(--line);
}

.walk-date b,
.walk-date span,
.walk-date small {
  display: block;
}

.walk-date b {
  font-size: 21px;
  line-height: 1;
}

.walk-date span {
  margin-top: 3px;
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
}

.walk-date small {
  margin-top: 5px;
  color: var(--forest);
  font-size: 11px;
  font-weight: 800;
}

.walk-info,
.walk-meta {
  min-width: 0;
}

.walk-info strong,
.walk-meta strong {
  display: block;
  font-size: 13px;
}

.walk-info span,
.walk-meta span {
  display: block;
  margin-top: 5px;
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.4;
}

.capacity {
  min-width: 150px;
}

.capacity-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
  font-size: 10px;
  font-weight: 800;
}

.capacity-track {
  height: 7px;
  border-radius: 99px;
  background: #ece9e2;
  overflow: hidden;
}

.capacity-fill {
  height: 100%;
  border-radius: inherit;
  background: var(--forest-2);
}

.capacity-fill.full {
  background: var(--clay);
}

.walk-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.avatars {
  display: flex;
  align-items: center;
  padding-left: 8px;
}

.mini-avatar {
  width: 32px;
  height: 32px;
  display: inline-grid;
  place-items: center;
  margin-left: -8px;
  border: 3px solid #fff;
  border-radius: 50%;
  overflow: hidden;
  color: var(--forest);
  background: var(--sage);
  font-size: 10px;
  font-weight: 900;
}

.mini-avatar img,
.avatar img,
.dog-visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.mini-avatar svg {
  width: 100%;
  height: 100%;
}

.detail-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  align-items: start;
  margin-bottom: 20px;
}

.back-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 12px;
  padding: 0;
  border: 0;
  color: var(--forest);
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-weight: 800;
}

.back-button svg {
  width: 17px;
  height: 17px;
}

.detail-title h2 {
  margin: 0;
  font-size: clamp(24px, 3vw, 38px);
  letter-spacing: -0.05em;
}

.detail-title p {
  margin: 8px 0 0;
  color: var(--ink-soft);
  font-size: 13px;
}

.detail-actions {
  display: flex;
  gap: 9px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.info-box {
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper-2);
}

.info-box span,
.info-box strong {
  display: block;
}

.info-box span {
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.info-box strong {
  margin-top: 6px;
  font-size: 13px;
  line-height: 1.35;
}

.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #ece9e2;
}

.tab-button {
  min-height: 36px;
  padding: 7px 12px;
  border: 0;
  border-radius: 9px;
  color: var(--ink-soft);
  background: transparent;
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
}

.tab-button.active {
  color: var(--ink);
  background: #fff;
  box-shadow: 0 3px 11px rgba(40, 51, 46, 0.08);
}

.application-list {
  display: grid;
  gap: 10px;
}

.application-card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--paper-2);
}

.application-card.accepted {
  border-color: #c8ddce;
  background: #f6faf6;
}

.application-card.waitlist {
  border-color: #ead5af;
  background: #fffaf1;
}

.avatar {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  overflow: hidden;
  background: var(--sage);
}

.avatar svg {
  width: 100%;
  height: 100%;
}

.application-main {
  min-width: 0;
}

.application-name {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
}

.application-name strong {
  font-size: 13px;
}

.application-main > p {
  margin: 5px 0 0;
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.45;
}

.application-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 7px;
}

.dog-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.dog-admin-card {
  padding: 14px;
  border: 1px solid rgba(201, 194, 183, 0.75);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.86);
  box-shadow: 0 7px 20px rgba(40, 51, 46, 0.045);
  cursor: pointer;
  transition: 150ms ease;
}

.dog-admin-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
}

.dog-admin-head {
  display: flex;
  align-items: center;
  gap: 12px;
}

.dog-admin-head .avatar {
  width: 58px;
  height: 58px;
  flex-basis: 58px;
}

.dog-admin-copy {
  min-width: 0;
  flex: 1;
}

.dog-admin-copy strong,
.dog-admin-copy span {
  display: block;
}

.dog-admin-copy strong {
  font-size: 15px;
}

.dog-admin-copy span {
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 11px;
}

.dog-admin-card .tag-row {
  margin-top: 13px;
}

.dog-admin-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 10px;
}

.profile-layout {
  display: grid;
  grid-template-columns: minmax(280px, 0.7fr) minmax(0, 1.3fr);
  gap: 20px;
}

.profile-summary {
  position: sticky;
  top: 105px;
  align-self: start;
}

.profile-visual {
  position: relative;
  height: 260px;
  overflow: hidden;
  border-radius: 18px;
  background: var(--sage);
}

.profile-visual svg,
.profile-visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-visual-overlay {
  position: absolute;
  inset: auto 0 0;
  padding: 36px 18px 16px;
  color: #fff;
  background: linear-gradient(180deg, transparent, rgba(18, 37, 31, 0.78));
}

.profile-visual-overlay h2 {
  margin: 0;
  font-size: 28px;
  letter-spacing: -0.04em;
}

.profile-visual-overlay p {
  margin: 4px 0 0;
  color: rgba(255, 255, 255, 0.78);
  font-size: 12px;
}

.profile-summary-content {
  padding: 17px;
}

.profile-quote {
  margin: 0;
  color: var(--ink);
  font-size: 13px;
  line-height: 1.55;
}

.profile-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 15px;
}

.definition-list {
  display: grid;
  gap: 0;
}

.definition-row {
  display: grid;
  grid-template-columns: minmax(120px, 0.48fr) minmax(0, 1fr);
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.definition-row:last-child {
  border-bottom: 0;
}

.definition-row dt {
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 700;
}

.definition-row dd {
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.45;
}

.timeline {
  display: grid;
  gap: 0;
}

.timeline-item {
  position: relative;
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 12px;
  padding-bottom: 18px;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 25px;
  bottom: 0;
  width: 1px;
  background: var(--line);
}

.timeline-item:last-child {
  padding-bottom: 0;
}

.timeline-item:last-child::before {
  display: none;
}

.timeline-dot {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--forest);
  background: var(--sage-2);
}

.timeline-dot svg {
  width: 13px;
  height: 13px;
}

.timeline-copy strong,
.timeline-copy span {
  display: block;
}

.timeline-copy strong {
  font-size: 12px;
}

.timeline-copy span {
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 10px;
  line-height: 1.45;
}

.package-card {
  position: relative;
  padding: 18px;
  border: 1px solid rgba(201, 194, 183, 0.75);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.86);
  box-shadow: 0 7px 20px rgba(40, 51, 46, 0.045);
  overflow: hidden;
}

.package-card::after {
  content: "";
  position: absolute;
  width: 94px;
  height: 94px;
  right: -42px;
  bottom: -48px;
  border-radius: 50%;
  background: var(--sage);
  opacity: 0.65;
}

.package-head {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 11px;
}

.package-copy {
  min-width: 0;
  flex: 1;
}

.package-copy strong,
.package-copy span {
  display: block;
}

.package-copy strong {
  font-size: 14px;
}

.package-copy span {
  margin-top: 3px;
  color: var(--ink-soft);
  font-size: 10px;
}

.package-balance {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-top: 17px;
}

.package-balance b {
  font-size: 30px;
  line-height: 1;
  letter-spacing: -0.05em;
}

.package-balance span {
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 700;
}

.package-dots {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 5px;
  margin-top: 13px;
}

.package-dot {
  width: 25px;
  height: 7px;
  border-radius: 99px;
  background: #e7e3db;
}

.package-dot.used {
  background: var(--clay);
}

.package-dot.reserved {
  background: var(--amber);
}

.package-dot.available {
  background: var(--forest-2);
}

.finance-list {
  display: grid;
}

.finance-row {
  display: grid;
  grid-template-columns: minmax(170px, 1.25fr) minmax(120px, 0.8fr) minmax(100px, 0.7fr) minmax(100px, 0.6fr) auto;
  align-items: center;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.finance-row:last-child {
  border-bottom: 0;
}

.finance-row strong,
.finance-row span {
  display: block;
}

.finance-row strong {
  font-size: 12px;
}

.finance-row span {
  margin-top: 3px;
  color: var(--ink-soft);
  font-size: 10px;
}

.money {
  font-size: 13px;
  font-weight: 900;
}

.psinder-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.psinder-card {
  border: 1px solid rgba(201, 194, 183, 0.76);
  border-radius: 22px;
  background: #fff;
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}

.dog-visual {
  position: relative;
  height: 245px;
  overflow: hidden;
  background: var(--sage);
}

.dog-visual svg {
  width: 100%;
  height: 100%;
}

.dog-visual-top {
  position: absolute;
  inset: 12px 12px auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.dog-distance {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 9px;
  border-radius: 99px;
  color: #fff;
  background: rgba(28, 47, 41, 0.54);
  backdrop-filter: blur(7px);
  font-size: 10px;
  font-weight: 800;
}

.dog-distance svg {
  width: 13px;
  height: 13px;
}

.psinder-body {
  padding: 17px;
}

.psinder-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.psinder-title h3 {
  margin: 0;
  font-size: 22px;
  letter-spacing: -0.04em;
}

.psinder-title span {
  display: block;
  margin-top: 3px;
  color: var(--ink-soft);
  font-size: 10px;
}

.psinder-copy {
  min-height: 66px;
  margin: 12px 0 0;
  color: var(--ink);
  font-size: 12px;
  line-height: 1.55;
}

.psinder-actions {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px;
  margin-top: 15px;
}

.round-action {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 13px;
  color: var(--ink-soft);
  background: #fff;
  cursor: pointer;
}

.round-action:hover {
  color: var(--red);
  background: var(--red-soft);
}

.round-action svg {
  width: 18px;
  height: 18px;
}

.client-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(310px, 0.65fr);
  gap: 22px;
}

.client-next-walk {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  padding: 18px;
  border: 1px solid rgba(201, 194, 183, 0.75);
  border-radius: 18px;
  background: var(--paper-2);
}

.client-next-date {
  width: 66px;
  height: 72px;
  display: grid;
  place-content: center;
  border-radius: 17px;
  color: #fff;
  background: var(--forest);
  text-align: center;
}

.client-next-date b {
  font-size: 27px;
  line-height: 1;
}

.client-next-date span {
  margin-top: 5px;
  color: rgba(255, 255, 255, 0.7);
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
}

.client-next-copy {
  min-width: 0;
}

.client-next-copy h3 {
  margin: 0;
  font-size: 17px;
  letter-spacing: -0.03em;
}

.client-next-copy p {
  margin: 6px 0 0;
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.45;
}

.walk-card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.client-walk-card {
  display: grid;
  gap: 14px;
  padding: 17px;
  border: 1px solid rgba(201, 194, 183, 0.75);
  border-radius: 19px;
  background: rgba(255, 255, 255, 0.87);
  box-shadow: 0 7px 20px rgba(40, 51, 46, 0.045);
}

.client-walk-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.client-walk-date {
  display: flex;
  align-items: center;
  gap: 10px;
}

.client-walk-date-tile {
  width: 48px;
  height: 52px;
  display: grid;
  place-content: center;
  border-radius: 13px;
  color: var(--forest);
  background: var(--sage-2);
  text-align: center;
}

.client-walk-date-tile b {
  font-size: 19px;
  line-height: 1;
}

.client-walk-date-tile span {
  margin-top: 3px;
  font-size: 8px;
  font-weight: 900;
  text-transform: uppercase;
}

.client-walk-date-copy strong,
.client-walk-date-copy span {
  display: block;
}

.client-walk-date-copy strong {
  font-size: 13px;
}

.client-walk-date-copy span {
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 10px;
}

.client-walk-card > p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.5;
}

.client-walk-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}

.price {
  font-size: 14px;
  font-weight: 900;
}

.price span {
  color: var(--ink-soft);
  font-size: 9px;
  font-weight: 700;
}

.empty-state {
  display: grid;
  place-items: center;
  min-height: 250px;
  padding: 40px 20px;
  text-align: center;
  border: 1px dashed var(--line-strong);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.56);
}

.empty-icon {
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: 17px;
  color: var(--forest);
  background: var(--sage-2);
}

.empty-icon svg {
  width: 25px;
  height: 25px;
}

.empty-state h3 {
  margin: 15px 0 0;
  font-size: 16px;
}

.empty-state p {
  max-width: 380px;
  margin: 7px 0 0;
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.5;
}

.empty-state .primary-button {
  margin-top: 15px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(20, 35, 30, 0.55);
  backdrop-filter: blur(5px);
  animation: fadeIn 150ms ease;
}

.modal {
  width: min(670px, 100%);
  max-height: calc(100vh - 40px);
  overflow: auto;
  border: 1px solid rgba(255, 255, 255, 0.58);
  border-radius: 24px;
  background: var(--paper-2);
  box-shadow: 0 26px 80px rgba(15, 31, 25, 0.28);
  animation: liftIn 180ms ease;
}

.modal.wide {
  width: min(860px, 100%);
}

.modal-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 21px 22px 16px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 253, 248, 0.96);
  backdrop-filter: blur(10px);
}

.modal-head h2 {
  margin: 0;
  font-size: 21px;
  letter-spacing: -0.04em;
}

.modal-head p {
  margin: 5px 0 0;
  color: var(--ink-soft);
  font-size: 11px;
}

.modal-close {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #fff;
  cursor: pointer;
}

.modal-close svg {
  width: 17px;
  height: 17px;
}

.modal-body {
  padding: 21px 22px 24px;
}

.modal-foot {
  position: sticky;
  bottom: 0;
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  padding: 15px 22px;
  border-top: 1px solid var(--line);
  background: rgba(255, 253, 248, 0.96);
  backdrop-filter: blur(10px);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.form-grid .full {
  grid-column: 1 / -1;
}

.field {
  display: grid;
  gap: 7px;
}

.field label {
  color: var(--ink);
  font-size: 11px;
  font-weight: 800;
}

.field small {
  color: var(--ink-soft);
  font-size: 9px;
  line-height: 1.4;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  min-height: 43px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  background: #fff;
}

.field textarea {
  min-height: 90px;
  resize: vertical;
  line-height: 1.45;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--forest-2);
}

.check-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
}

.check-row input {
  width: 16px;
  height: 16px;
  margin-top: 1px;
  accent-color: var(--forest);
}

.check-row label {
  color: var(--ink-soft);
  font-size: 10px;
  line-height: 1.45;
}

.segmented {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #ece9e2;
}

.segmented label {
  position: relative;
}

.segmented input {
  position: absolute;
  opacity: 0;
}

.segmented span {
  min-height: 37px;
  display: grid;
  place-items: center;
  padding: 7px;
  border-radius: 9px;
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 800;
  cursor: pointer;
}

.segmented input:checked + span {
  color: var(--ink);
  background: #fff;
  box-shadow: 0 3px 10px rgba(40, 51, 46, 0.08);
}

.toast-stack {
  position: fixed;
  z-index: 200;
  right: 22px;
  bottom: 22px;
  display: grid;
  gap: 9px;
  pointer-events: none;
}

.toast {
  width: min(360px, calc(100vw - 44px));
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 13px 14px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 14px;
  color: #fff;
  background: var(--forest);
  box-shadow: 0 16px 45px rgba(17, 34, 28, 0.25);
  animation: toastIn 220ms ease;
}

.toast.error {
  background: #803d3b;
}

.toast.warn {
  background: #79571f;
}

.toast svg {
  width: 18px;
  height: 18px;
  flex: 0 0 18px;
}

.toast strong,
.toast span {
  display: block;
}

.toast strong {
  font-size: 11px;
}

.toast span {
  margin-top: 3px;
  color: rgba(255, 255, 255, 0.75);
  font-size: 10px;
  line-height: 1.4;
}

.mobile-nav {
  display: none;
}

.drawer-backdrop {
  display: none;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes liftIn {
  from { opacity: 0; transform: translateY(12px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 1180px) {
  .grid-4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .dog-grid,
  .psinder-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .walk-row {
    grid-template-columns: 68px minmax(180px, 1fr) minmax(150px, 0.8fr) auto;
  }

  .walk-row .capacity {
    display: none;
  }

  .info-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 980px) {
  :root {
    --sidebar: 230px;
  }

  .main {
    padding-inline: 24px;
  }

  .dashboard-grid,
  .client-grid,
  .profile-layout {
    grid-template-columns: 1fr;
  }

  .profile-summary {
    position: static;
  }

  .grid-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .walk-card-grid {
    grid-template-columns: 1fr;
  }

  .finance-row {
    grid-template-columns: minmax(180px, 1fr) minmax(100px, 0.7fr) auto;
  }

  .finance-row > :nth-child(2),
  .finance-row > :nth-child(4) {
    display: none;
  }
}

@media (max-width: 760px) {
  body {
    padding-bottom: 76px;
  }

  .app-shell {
    display: block;
  }

  .sidebar {
    width: min(290px, 86vw);
    transform: translateX(-105%);
    transition: transform 190ms ease;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 35;
    display: block;
    border: 0;
    background: rgba(17, 31, 26, 0.45);
    backdrop-filter: blur(3px);
  }

  .main {
    padding: 0 16px 28px;
  }

  .topbar {
    min-height: 78px;
    padding: 12px 0;
  }

  .mobile-menu-button {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.8);
  }

  .mobile-menu-button svg {
    width: 19px;
    height: 19px;
  }

  .page-heading h1 {
    font-size: 25px;
  }

  .page-heading p {
    display: none;
  }

  .topbar-actions .primary-button span,
  .topbar-actions .secondary-button span {
    display: none;
  }

  .topbar-actions .primary-button,
  .topbar-actions .secondary-button {
    width: 42px;
    height: 42px;
    min-height: 42px;
    padding: 0;
  }

  .grid-2,
  .grid-3,
  .grid-4,
  .dog-grid,
  .psinder-grid,
  .info-grid {
    grid-template-columns: 1fr;
  }

  .kpi-card {
    min-height: 114px;
  }

  .dashboard-grid,
  .client-grid {
    gap: 16px;
  }

  .hero-card {
    min-height: 0;
    padding: 22px;
  }

  .hero-card h2 {
    font-size: 30px;
  }

  .hero-actions {
    flex-direction: column;
  }

  .hero-actions > * {
    width: 100%;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .toolbar-left,
  .toolbar-right {
    width: 100%;
  }

  .search-box {
    min-width: 0;
    flex: 1;
  }

  .filter-select {
    min-width: 0;
    flex: 1;
  }

  .walk-row {
    grid-template-columns: 58px minmax(0, 1fr) auto;
    gap: 12px;
    padding: 14px;
  }

  .walk-row .walk-meta {
    display: none;
  }

  .walk-actions .avatars,
  .walk-actions .badge {
    display: none;
  }

  .detail-header {
    grid-template-columns: 1fr;
  }

  .detail-actions {
    width: 100%;
  }

  .detail-actions > * {
    flex: 1;
  }

  .application-card {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .application-actions {
    grid-column: 1 / -1;
    justify-content: flex-start;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }

  .client-next-walk {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .client-next-walk > .secondary-button {
    grid-column: 1 / -1;
    width: 100%;
  }

  .definition-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-grid .full {
    grid-column: auto;
  }

  .modal-backdrop {
    align-items: end;
    padding: 0;
  }

  .modal,
  .modal.wide {
    width: 100%;
    max-height: 92vh;
    border-radius: 24px 24px 0 0;
  }

  .mobile-nav {
    position: fixed;
    inset: auto 10px 10px;
    z-index: 50;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 7px;
    border: 1px solid rgba(201, 194, 183, 0.8);
    border-radius: 18px;
    background: rgba(255, 253, 248, 0.92);
    box-shadow: 0 14px 44px rgba(25, 45, 38, 0.18);

    font-size: 8px;
    font-weight: 800;

  .mobile-nav button.active {
    color: var(--forest);
    background: var(--sage-2);
  }

  .mobile-nav svg {
    width: 18px;
    height: 18px;
  }

  .toast-stack {
    right: 12px;
    bottom: 88px;
  }
}

@media (max-width: 460px) {
  .main {
    padding-inline: 12px;

  .card.pad,

    padding: 17px;

    padding: 17px 17px 0;

  .grid-4 {

    margin-bottom: 15px;

  .dog-visual {
    height: 285px;

  .walk-row {

  .walk-date {

  .walk-date b {

  }

  .walk-info strong {
    font-size: 12px;

}


@media (max-width: 460px) {

  }

  .kpi-link svg {
    transition: none;
  }

  let state = loadState();

  function deepClone(value) {
    return JSON.parse(JSON.stringify(value));
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return deepClone(DEFAULT_STATE);
      const parsed = JSON.parse(saved);
      if (parsed.version !== DEFAULT_STATE.version) return deepClone(DEFAULT_STATE);
      return {
        ...deepClone(DEFAULT_STATE),
        ...parsed,
        ui: { ...deepClone(DEFAULT_STATE.ui), ...(parsed.ui || {}) }
      };
    } catch (error) {
      console.warn("Nie udało się odczytać danych demo", error);
      return deepClone(DEFAULT_STATE);
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (error) {
      console.warn("Nie udało się zapisać danych demo", error);
    }
  }

  function esc(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function uid(prefix) {
    return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
  }

  function dateObject(dateString) {
    return new Date(`${dateString}T12:00:00`);
  }

  function formatDate(dateString, options = { day: "numeric", month: "long", year: "numeric" }) {
    return new Intl.DateTimeFormat("pl-PL", options).format(dateObject(dateString));
  }

  function monthShort(dateString) {
    return new Intl.DateTimeFormat("pl-PL", { month: "short" }).format(dateObject(dateString)).replace(".", "");
  }

  function weekday(dateString) {
    return new Intl.DateTimeFormat("pl-PL", { weekday: "long" }).format(dateObject(dateString));
  }

  function dayNumber(dateString) {
    return dateObject(dateString).getDate();
  }

  function isUpcoming(walk) {
    return walk.date >= TODAY && walk.status !== "cancelled" && walk.status !== "completed";
  }

  function sortWalks(walks) {
    return [...walks].sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
  }

  function getDog(id) {
    return state.dogs.find((dog) => dog.id === id);
  }

  function getGuardian(id) {
    return state.guardians.find((guardian) => guardian.id === id);
  }

  function getWalk(id) {
    return state.walks.find((walk) => walk.id === id);
  }

  function getPackage(id) {
    return state.packages.find((item) => item.id === id);
  }

  function activeDog() {
    return getDog(state.activeDogId) || state.dogs[0];
  }

  function acceptedApplications(walk) {
    return walk.applications.filter((app) => app.status === "accepted");
  }

  function pendingApplications(walk) {
    return walk.applications.filter((app) => app.status === "pending");
  }

  function waitlistApplications(walk) {
    return walk.applications.filter((app) => app.status === "waitlist");
  }

  function applicationForDog(walk, dogId) {
    return walk.applications.find((app) => app.dogId === dogId && !["rejected", "cancelled"].includes(app.status));
  }

  function availableCredits(packageItem) {
    return Math.max(0, packageItem.total - packageItem.used - packageItem.reserved);
  }

  function activePackagesForDog(dogId) {
    return state.packages.filter((item) => item.dogId === dogId && item.status === "active" && availableCredits(item) > 0);
  }

  function packageBalanceForDog(dogId) {
    return activePackagesForDog(dogId).reduce((sum, item) => sum + availableCredits(item), 0);
  }

  function relationBetween(dogA, dogB) {
    return state.relations.find((relation) =>
      (relation.dogA === dogA && relation.dogB === dogB) ||
      (relation.dogA === dogB && relation.dogB === dogA)
    );
  }

  function conflictsForCandidate(walk, dogId) {
    const accepted = acceptedApplications(walk).filter((app) => app.dogId !== dogId);
    return accepted
      .map((app) => {
        const relation = relationBetween(dogId, app.dogId);
        if (!relation || relation.level === "good") return null;
        return { relation, otherDog: getDog(app.dogId) };
      })
      .filter(Boolean);
  }

  function allWalkConflicts(walk) {
    const apps = acceptedApplications(walk);
    const results = [];
    for (let i = 0; i < apps.length; i += 1) {
      for (let j = i + 1; j < apps.length; j += 1) {
        const relation = relationBetween(apps[i].dogId, apps[j].dogId);
        if (relation && relation.level !== "good") {
          results.push({ relation, dogA: getDog(apps[i].dogId), dogB: getDog(apps[j].dogId) });
        }
      }
    }
    return results;
  }

  function renderAdminDashboard() {
    const upcoming = sortWalks(state.walks.filter(isUpcoming));

    return `<div class="stack">
      <div class="grid-4">

        ${kpiCard("Dzisiejsze spacery", todayWalks.length, `${todayWalks.reduce((sum, walk) => sum + acceptedApplications(walk).length, 0)} zaakceptowanych psów`, "walk", "#dce8dd", "today")}
        ${kpiCard("Zaległe płatności", duePayments.length, duePayments.length ? "Wymagają przypomnienia" : "Brak zaległości", "credit", "#f3d8d1", "due-payments")}

      </div>

      ${nextWalk ? `
        <article class="card hero-card">
          <div class="hero-content">
            <span class="hero-eyebrow">${icon("calendar")} Najbliższy spacer</span>
            <h2>${formatDate(nextWalk.date, { weekday: "long", day: "numeric", month: "long" })}, ${esc(nextWalk.time)}</h2>
            <p>${esc(nextWalk.location)}. ${esc(nextWalk.type)}. ${acceptedApplications(nextWalk).length} z ${nextWalk.capacity} miejsc jest już potwierdzonych.</p>
            <div class="hero-actions">
              <button class="primary-button" data-action="open-walk" data-id="${nextWalk.id}">${icon("users")} Otwórz skład</button>
              <button class="secondary-button" data-action="open-map" data-url="${esc(nextWalk.mapUrl)}">${icon("map")} Dokładna lokalizacja</button>
            </div>
          </div>
        </article>
      ` : ""}

      <div class="dashboard-grid">
        <article class="card">
          <div class="card-head">
            <div>
              <h2>Najbliższe terminy</h2>
              <p>Jedna lista zamiast osobnych zakładek miesięcznych</p>
            </div>
            <button class="ghost-button" data-action="navigate" data-view="admin-walks">Wszystkie ${icon("chevronRight")}</button>
          </div>
          <div class="card-body">
            <div class="list">
              ${upcoming.slice(0, 5).map((walk) => renderDashboardWalkRow(walk)).join("")}
            </div>
          </div>
        </article>

        <div class="stack">
          <article class="card">
            <div class="card-head">
              <div>
                <h3>Wymaga uwagi</h3>
                <p>Zgłoszenia i profile do sprawdzenia</p>
              </div>
            </div>
            <div class="card-body">
              <div class="list">
                ${pending.slice(0, 4).map(({ walk, app }) => {
                  const dog = getDog(app.dogId);
                  return `<div class="list-row">
                    <div class="avatar">${dogArt(dog, true)}</div>
                    <div class="list-main">
                      <strong>${esc(dog.name)} na ${dayNumber(walk.date)} ${monthShort(walk.date)}</strong>
                      <span>${esc(dog.privateProfile.flags.slice(0, 2).join(" · "))}</span>
                    </div>
                    <button class="small-button" data-action="open-walk" data-id="${walk.id}">Sprawdź</button>
                  </div>`;
                }).join("") || `<div class="alert green">${icon("checkCircle")} Brak zgłoszeń oczekujących na decyzję.</div>`}
              </div>
            </div>
          </article>

          <article class="card pad">
            <div class="section-title">
              <div>
                <h3>Szybki podgląd pakietów</h3>
                <p>Niewykorzystane wejścia klientów</p>
              </div>
              <button class="ghost-button" data-action="navigate" data-view="admin-finance">Otwórz</button>
            </div>
            <div class="alert blue">${icon("package")} ${state.packages.filter((item) => item.status === "active").reduce((sum, item) => sum + availableCredits(item), 0)} wejść pozostaje do wykorzystania w aktywnych pakietach.</div>
          </article>
        </div>
      </div>
    </div>`;
  }

  function renderDashboardWalkRow(walk) {
    const accepted = acceptedApplications(walk);
    const pending = pendingApplications(walk);
    return `<div class="list-row">
      <div class="date-tile"><b>${dayNumber(walk.date)}</b><span>${monthShort(walk.date)}</span></div>
      <div class="list-main">

  function renderAdminWalks() {
    const query = state.ui.search.trim().toLowerCase();
    let walks = sortWalks(state.walks);
    if (state.ui.walkFilter === "upcoming") walks = walks.filter(isUpcoming);
    if (state.ui.walkFilter === "pending") walks = walks.filter((walk) => isUpcoming(walk) && pendingApplications(walk).length > 0);
    if (state.ui.walkFilter === "today") walks = walks.filter((walk) => walk.date === TODAY);
    if (state.ui.walkFilter === "next-six") walks = walks.filter(isUpcoming).slice(0, 6);
    if (state.ui.walkFilter === "completed") walks = walks.filter((walk) => walk.status === "completed" || walk.date < TODAY);
    if (query) {
      walks = walks.filter((walk) => [walk.location, walk.type, walk.info, ...walk.tags].join(" ").toLowerCase().includes(query));
    }

    return `<div class="stack">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">${icon("search")}<input type="search" data-input="search" placeholder="Szukaj miejsca lub rodzaju" value="${esc(state.ui.search)}" /></div>
          <select class="filter-select" data-input="walk-filter">
            <option value="upcoming" ${state.ui.walkFilter === "upcoming" ? "selected" : ""}>Nadchodzące</option>
            <option value="pending" ${state.ui.walkFilter === "pending" ? "selected" : ""}>Zgłoszenia do decyzji</option>
            <option value="today" ${state.ui.walkFilter === "today" ? "selected" : ""}>Dzisiejsze</option>
            <option value="next-six" ${state.ui.walkFilter === "next-six" ? "selected" : ""}>Najbliższe 6</option>
            <option value="completed" ${state.ui.walkFilter === "completed" ? "selected" : ""}>Zakończone</option>

      </div>
    </div>`;
  }

  function renderAdminWalkRow(walk) {
    const accepted = acceptedApplications(walk);
    const pending = pendingApplications(walk);
    const percent = Math.min(100, Math.round((accepted.length / walk.capacity) * 100));
    const full = accepted.length >= walk.capacity;
    return `<article class="walk-row" data-action="open-walk" data-id="${walk.id}">
      <div class="walk-date">
        <b>${dayNumber(walk.date)}</b>
        <span>${monthShort(walk.date)}</span>
        <small>${esc(walk.time)}</small>
      </div>
      <div class="walk-info">
        <strong>${esc(walk.location)}</strong>
        <span>${esc(walk.type)}</span>
        <div class="tag-row" style="margin-top:8px">${walk.tags.slice(0, 2).map((tag) => `<span class="tag">${esc(tag)}</span>`).join("")}</div>
      </div>
      <div class="walk-meta">
        <strong>${esc(walkMode(walk.mode))}</strong>
        <span>${pending.length ? `${pending.length} zgłoszeń czeka` : "Brak oczekujących zgłoszeń"}</span>
      </div>
      <div class="capacity">
        <div class="capacity-top"><span>Miejsca</span><span>${accepted.length}/${walk.capacity}</span></div>

      </div>
      <div class="walk-actions">
        ${pending.length ? badge(`${pending.length} do decyzji`, "amber") : badge(full ? "pełny" : "otwarty", full ? "clay" : "green")}
        <div class="avatars">${accepted.slice(0, 3).map((app) => miniAvatar(getDog(app.dogId))).join("")}</div>
        <button class="icon-button" data-action="open-walk" data-id="${walk.id}" aria-label="Otwórz spacer">${icon("chevronRight")}</button>
      </div>
    </article>`;
  }

      { id: "waitlist", label: `Rezerwowa (${waitlist.length})` }
    ];

    return `<div class="stack">
      <div class="detail-header">

        </div>
      </div>

      <article class="card pad">

          <div class="info-box"><span>Miejsce zbiórki</span><strong>${esc(walk.locationDetails)}</strong></div>
          <div class="info-box"><span>Skład</span><strong>${accepted.length} z ${walk.capacity} psów</strong></div>
          <div class="info-box"><span>Zasada zapisu</span><strong>${esc(walkMode(walk.mode))}</strong></div>

      <article class="card">

          <div>
            <h2>Zarządzanie składem</h2>
            <p>Jedno zgłoszenie zmienia status. Nie kopiujesz imienia między kolumnami.</p>

          <div class="tabs">

        </div>
        <div class="card-body">
          ${renderWalkTab(walk)}
        </div>
      </article>
    </div>`;

  function renderWalkTab(walk) {
    if (state.ui.walkTab === "participants") {

      </div>
    </article>`;

  function findMatches() {
    const pairs = new Set();
    const matches = [];
    state.interests.forEach((interest) => {
      const reverse = state.interests.find((item) => item.fromDogId === interest.toDogId && item.toDogId === interest.fromDogId);
      if (!reverse) return;
      const key = [interest.fromDogId, interest.toDogId].sort().join("|");
      if (!pairs.has(key)) {
        pairs.add(key);
        matches.push(key.split("|"));
      }
    });
    return matches;
  }

  function renderModal() {
    const root = document.getElementById("modal-root");
    if (!state.ui.modal) {
      root.innerHTML = "";
      return;
    }

    let content = "";
    switch (state.ui.modal.type) {
      case "new-walk": content = modalNewWalk(state.ui.modal.payload || {}); break;
      case "edit-public-profile": content = modalEditPublicProfile(); break;
      case "add-payment": content = modalAddPayment(); break;
      case "add-package": content = modalAddPackage(state.ui.modal.payload?.dogId); break;
      case "add-note": content = modalAddNote(state.ui.modal.payload?.dogId); break;
      case "edit-dog-status": content = modalEditDogStatus(state.ui.modal.payload?.dogId); break;
      case "about": content = modalAbout(); break;
      case "notifications": content = modalNotifications(); break;

    const date = dateObject(dateString);

    return date.toISOString().slice(0, 10);
  }

  function findApp(walkId, appId) {
    const walk = getWalk(walkId);
    const app = walk?.applications.find((item) => item.id === appId);
    return { walk, app };
  }

  function reservePackage(dogId) {
    const packageItem = activePackagesForDog(dogId)[0];
    if (!packageItem) return null;
    packageItem.reserved += 1;
    return packageItem;
  }

  function releasePackageReservation(app) {
    if (!app.packageId) return;
    const item = getPackage(app.packageId);
    if (item && item.reserved > 0) item.reserved -= 1;
    app.packageId = null;
    if (app.paymentStatus === "package-reserved") app.paymentStatus = "none";
  }

  function consumePackageReservation(app) {
    if (!app.packageId) return;
    const item = getPackage(app.packageId);
    if (item) {
      if (item.reserved > 0) item.reserved -= 1;
      item.used += 1;
      if (item.used >= item.total) item.status = "completed";
    }
    app.paymentStatus = "package-used";
  }

  function approveApplication(walkId, appId) {
    const { walk, app } = findApp(walkId, appId);
    if (!walk || !app) return;
    if (app.status !== "accepted" && acceptedApplications(walk).length >= walk.capacity) {
      showToast("Brak miejsca", "Przenieś psa na listę rezerwową albo zwiększ limit.", "error");
      return;
    }
    const conflicts = conflictsForCandidate(walk, app.dogId);
    const blocking = conflicts.filter((item) => item.relation.level === "block");
    if (blocking.length) {
      const names = blocking.map((item) => item.otherDog.name).join(", ");
      const proceed = window.confirm(`W profilu zapisano zakaz połączenia z: ${names}. Czy mimo to zatwierdzić skład?`);
      if (!proceed) return;
    }
    if (app.status !== "accepted") {
      const packageItem = reservePackage(app.dogId);
      app.status = "accepted";
      if (packageItem) {
        app.packageId = packageItem.id;
        app.paymentStatus = "package-reserved";
      } else if (app.paymentStatus !== "paid") {
        app.paymentStatus = "due";
      }
    }
    state.ui.walkTab = "participants";
    showToast("Pies został zaakceptowany", packageBalanceForDog(app.dogId) >= 0 ? "Klient zobaczy dokładną lokalizację." : "");
    renderApp();
  }

  function setApplicationStatus(walkId, appId, status) {
    const { app } = findApp(walkId, appId);
    if (!app) return;
    if (app.status === "accepted") releasePackageReservation(app);
    app.status = status;
    if (["waitlist", "rejected", "pending"].includes(status)) {
      app.paymentStatus = "none";
      app.packageId = null;
    }
    if (status === "waitlist") state.ui.walkTab = "waitlist";
    showToast(status === "waitlist" ? "Dodano na listę rezerwową" : status === "rejected" ? "Zgłoszenie odrzucone" : "Zgłoszenie wróciło do decyzji");
    renderApp();
  }

  function markAttendance(walkId, appId, outcome) {
    const { walk, app } = findApp(walkId, appId);
    if (!walk || !app || app.status !== "accepted") return;
    if (app.attendance !== "pending") return;
    app.attendance = outcome;
    if (["present", "no-show", "late-cancel"].includes(outcome)) consumePackageReservation(app);
    const dog = getDog(app.dogId);
    dog.history.push({
      date: walk.date,
      type: "walk",
      title: outcome === "present" ? walk.type : outcome === "late-cancel" ? "Późne odwołanie" : "Nieobecność",
      note: outcome === "present" ? `${walk.location}. Udział oznaczony przez prowadzącą.` : "Wejście rozliczone zgodnie z zasadami anulowania."
    });
    showToast(outcome === "present" ? "Obecność zapisana" : "Nieobecność rozliczona", outcome === "present" ? "Wejście zostało wykorzystane." : "Wejście zostało pobrane z pakietu.");
    renderApp();
  }

  function undoAttendance(walkId, appId) {
    const { walk, app } = findApp(walkId, appId);
    if (!walk || !app || app.attendance === "pending") return;
    if (app.packageId) {
      const item = getPackage(app.packageId);
      if (item && item.used > 0) {
        item.used -= 1;
        item.reserved += 1;
        item.status = "active";
      }
      app.paymentStatus = "package-reserved";
    }
    const dog = getDog(app.dogId);
    const historyIndex = dog.history.findIndex((item) => item.date === walk.date && [walk.type, "Późne odwołanie", "Nieobecność"].includes(item.title));
    if (historyIndex >= 0) dog.history.splice(historyIndex, 1);
    app.attendance = "pending";
    showToast("Cofnięto rozliczenie");
    renderApp();
  }

  function cancelBooking(walkId, appId) {
    const { app } = findApp(walkId, appId);
    if (!app) return;
    releasePackageReservation(app);
    app.status = "cancelled";
    app.attendance = "pending";
    showToast("Rezerwacja odwołana", "Wejście wróciło do pakietu.");
    renderApp();
  }

  function bookWalk(walkId) {
    const walk = getWalk(walkId);
    const dog = activeDog();
    if (!walk || applicationForDog(walk, dog.id)) {
      showToast("Zgłoszenie już istnieje", "Status zobaczysz na karcie spaceru.", "warn");
      return;
    }
    walk.applications.push({
      id: uid("app"),
      dogId: dog.id,
      status: "pending",
      paymentStatus: "none",
      packageId: null,
      attendance: "pending",
      createdAt: TODAY
    });
    showToast("Zgłoszenie wysłane", "Joanna sprawdzi profil psa i skład grupy.");
    renderApp();
  }

  function expressInterest(targetDogId) {
    const fromDog = activeDog();
    if (fromDog.id === targetDogId) return;
    const exists = state.interests.some((item) => item.fromDogId === fromDog.id && item.toDogId === targetDogId);
    if (exists) return;
    state.interests.push({ id: uid("interest"), fromDogId: fromDog.id, toDogId: targetDogId, createdAt: TODAY, status: "open" });
    const reverse = state.interests.some((item) => item.fromDogId === targetDogId && item.toDogId === fromDog.id);
    if (reverse) {
      state.interests.filter((item) =>
        (item.fromDogId === fromDog.id && item.toDogId === targetDogId) ||
        (item.fromDogId === targetDogId && item.toDogId === fromDog.id)
      ).forEach((item) => { item.status = "matched"; });
      showToast("To jest match", "Joanna sprawdzi, czy wspólny spacer będzie dobrym pomysłem.");
    } else {
      showToast("Zainteresowanie zapisane", "Drugi opiekun nie dostał Twoich danych kontaktowych.");
    }
    closeModal();
    renderApp();
  }

  function createDuet(dogAId, dogBId) {
    const dogA = getDog(dogAId);
    const dogB = getDog(dogBId);
    const relation = relationBetween(dogAId, dogBId);
    if (relation?.level === "block") {
      showToast("Tego duetu nie należy tworzyć", relation.note, "error");
      return;
    }
    const newWalk = {
      id: uid("walk"),
      date: "2026-09-17",
      time: "09:15",
      location: "Park Zachodni, okolice Orbity",
      locationDetails: "Przy wejściu od Wejherowskiej, obok stojaków rowerowych",
      mapUrl: "https://maps.google.com/?q=Park+Zachodni+Orbita+Wroclaw",
      type: "Duet socjalizacyjny",
      price: 90,
      capacity: 2,
      mode: "invite",
      info: `Duet przygotowany dla ${dogA.name} i ${dogB.name}.`,
      tags: ["duet", "na zaproszenie"],
      status: "open",
      leader: "Joanna",
      applications: [dogAId, dogBId].map((dogId) => ({ id: uid("app"), dogId, status: "pending", paymentStatus: "none", packageId: null, attendance: "pending", createdAt: TODAY }))
    };
    state.walks.push(newWalk);
    showToast("Utworzono propozycję duetu", "Termin jest szkicem do dalszej edycji.");
    openWalk(newWalk.id);
  }

  function duplicateWalk(id) {
    const source = getWalk(id);
    if (!source) return;
    openModal("new-walk", { sourceWalkId: id });
  }

  function togglePublish(dogId) {
    const dog = getDog(dogId);
    if (!dog) return;
    dog.publicProfile.published = !dog.publicProfile.published;
    showToast(dog.publicProfile.published ? "Profil został opublikowany" : "Profil został ukryty");
    renderApp();
  }

  function resetDemo() {
    const confirmed = window.confirm("Przywrócić wszystkie przykładowe dane i usunąć zmiany z tej przeglądarki?");
    if (!confirmed) return;
    localStorage.removeItem(STORAGE_KEY);
    state = deepClone(DEFAULT_STATE);
    showToast("Dane demonstracyjne przywrócone");
    renderApp();
  }

  function openExternal(url) {
    if (!url) return;
    window.open(url, "_blank", "noopener,noreferrer");
  }

  function handleClick(event) {
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;

    if (action === "navigate") navigate(target.dataset.view);
    if (action === "dashboard-jump") dashboardJump(target.dataset.target);
    if (action === "open-walk") openWalk(target.dataset.id);
    if (action === "open-dog") openDog(target.dataset.id);
    if (action === "open-modal") openModal(target.dataset.modal, { dogId: target.dataset.dog });
    if (action === "close-modal") closeModal();
    if (action === "modal-backdrop" && event.target === target) closeModal();
    if (action === "open-sidebar") { state.ui.sidebarOpen = true; renderApp(); }
    if (action === "close-sidebar") { state.ui.sidebarOpen = false; renderApp(); }
    if (action === "show-about") openModal("about");
    if (action === "show-notifications") openModal("notifications");
    if (action === "reset-demo") resetDemo();
    if (action === "open-map") openExternal(target.dataset.url);
    if (action === "call-guardian") showToast("Dane demonstracyjne", "Telefon jest fikcyjny.");
    if (action === "mail-guardian") showToast("Dane demonstracyjne", "Adres email jest fikcyjny.");
    if (action === "duplicate-walk") duplicateWalk(target.dataset.id);
    if (action === "set-walk-tab") { state.ui.walkTab = target.dataset.tab; renderApp(); }
    if (action === "approve-application") approveApplication(target.dataset.walk, target.dataset.app);
    if (action === "waitlist-application") setApplicationStatus(target.dataset.walk, target.dataset.app, "waitlist");
    if (action === "reject-application") setApplicationStatus(target.dataset.walk, target.dataset.app, "rejected");
    if (action === "restore-pending") setApplicationStatus(target.dataset.walk, target.dataset.app, "pending");
    if (action === "mark-attendance") markAttendance(target.dataset.walk, target.dataset.app, target.dataset.outcome);
    if (action === "undo-attendance") undoAttendance(target.dataset.walk, target.dataset.app);
    if (action === "cancel-booking") cancelBooking(target.dataset.walk, target.dataset.app);
    if (action === "book-walk") bookWalk(target.dataset.id);
    if (action === "interest") expressInterest(target.dataset.dog);
    if (action === "toggle-publish") togglePublish(target.dataset.dog);
    if (action === "toggle-own-publish") togglePublish(activeDog().id);
    if (action === "create-duet") createDuet(target.dataset.a, target.dataset.b);
    if (action === "delete-payment") {
      state.payments = state.payments.filter((payment) => payment.id !== target.dataset.id);
      showToast("Wpłata usunięta");
      renderApp();
    }
  }

  function handleChange(event) {
    const target = event.target;
    if (target.matches('[data-action="switch-role"]')) {
      state.role = target.value;
      state.view = state.role === "admin" ? "admin-dashboard" : "client-home";
      state.ui.search = "";
      state.ui.modal = null;
      renderApp();
      return;
    }
    if (target.dataset.input === "walk-filter") {
      state.ui.walkFilter = target.value;
      renderApp();
    }
    if (target.dataset.input === "dog-filter") {
      state.ui.dogFilter = target.value;
      renderApp();
    }
  }

  let searchTimer = null;
  function handleInput(event) {
    const target = event.target;
    if (target.dataset.input !== "search") return;
    window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(() => {
      state.ui.search = target.value;
      renderApp();
      const newInput = document.querySelector('[data-input="search"]');
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(newInput.value.length, newInput.value.length);
      }
    }, 180);
  }

  async function handleSubmit(event) {
    event.preventDefault();
    const form = event.target;
    const data = new FormData(form);

    if (form.id === "new-walk-form") {
      const walk = {
        id: uid("walk"),
        date: data.get("date"),
        time: data.get("time"),
        location: data.get("location").trim(),
        locationDetails: data.get("locationDetails").trim(),
        mapUrl: data.get("mapUrl").trim(),
        type: data.get("type").trim(),
        price: Number(data.get("price")),
        capacity: Number(data.get("capacity")),
        mode: data.get("mode"),
        info: data.get("info").trim(),
        tags: data.get("tags").split(",").map((item) => item.trim()).filter(Boolean),
        status: "open",
        leader: "Joanna",
        applications: []
      };
      state.walks.push(walk);
      closeModal();
      showToast("Spacer został dodany", `${formatDate(walk.date)} o ${walk.time}`);
      openWalk(walk.id);
      return;
    }

    if (form.id === "edit-public-profile-form") {
      const dog = activeDog();
      dog.publicProfile.area = data.get("area").trim();
      dog.publicProfile.distance = data.get("distance").trim();
      dog.publicProfile.headline = data.get("headline").trim();
      dog.publicProfile.seeking = data.get("seeking").trim();
      dog.publicProfile.traits = data.get("traits").split(",").map((item) => item.trim()).filter(Boolean);
      dog.publicProfile.likes = data.get("likes").trim();
      dog.publicProfile.dislikes = data.get("dislikes").trim();
      dog.publicProfile.published = data.get("published") === "on";
      const file = form.querySelector('[name="photo"]').files?.[0];
      if (file) {
        if (file.size > 1_500_000) {
          showToast("Zdjęcie jest za duże", "W demo użyj pliku do 1,5 MB.", "error");
          return;
        }
        dog.photo = await fileToDataUrl(file);
      }
      dog.history.push({ date: TODAY, type: "note", title: "Zmiana profilu Psiutków", note: "Opiekun zaktualizował publiczny opis psa." });
      closeModal();
      showToast("Profil został zapisany");
      renderApp();
      return;
    }

    if (form.id === "add-payment-form") {
      const dog = getDog(data.get("dogId"));
      state.payments.push({
        id: uid("payment"),
        date: data.get("date"),
        guardianId: dog.guardianId,
        dogId: dog.id,
        amount: Number(data.get("amount")),
        method: data.get("method"),
        status: "paid",
        description: data.get("description").trim()
      });
      closeModal();
      showToast("Wpłata została dodana");
      renderApp();
      return;
    }

    if (form.id === "add-package-form") {
      const total = Number(data.get("total"));
      const dogId = data.get("dogId");
      state.packages.push({
        id: uid("package"),
        dogId,
        name: `Pakiet ${total} spacerów`,
        total,
        used: 0,
        reserved: 0,
        price: Number(data.get("price")),
        purchasedAt: data.get("purchasedAt"),
        expiresAt: data.get("expiresAt"),
        status: "active"
      });
      closeModal();
      showToast("Pakiet został dodany", `${getDog(dogId).name} ma ${total} nowych wejść.`);
      renderApp();
      return;
    }

    if (form.id === "add-note-form") {
      const dog = getDog(data.get("dogId"));
      dog.history.push({ date: data.get("date"), type: "note", title: data.get("title").trim(), note: data.get("note").trim() });
      closeModal();
      showToast("Notatka została zapisana");
      renderApp();
      return;
    }

    if (form.id === "edit-dog-status-form") {
      const dog = getDog(data.get("dogId"));
      dog.status = data.get("status");
      dog.history.push({ date: TODAY, type: "note", title: "Zmiana statusu", note: data.get("note").trim() });
      closeModal();
      showToast("Status psa został zmieniony");
      renderApp();
    }
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.addEventListener("click", handleClick);
  document.addEventListener("change", handleChange);
  document.addEventListener("input", handleInput);
  document.addEventListener("submit", handleSubmit);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && state.ui.modal) closeModal();
  });

  renderApp();
})();

</script>
</body>
</html>
